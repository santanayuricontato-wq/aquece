<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aquece">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<title>Aquece Voz e Cordas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Share+Tech+Mono&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: rack de palco — cada ferramenta é um "equipamento" com visor LCD, LEDs e um footswitch grande; no celular a navegação vai para a base da tela */
:root{
  --chassis:#111316; --panel:#1B1E22; --raised:#2A2E34; --edge:#363B42; --silk:#9AA3AD; --ink:#EDF0F3;
  --lcd:#07120C; --lcd-ink:#86FFBA; --lcd-dim:#1E4630; --lcd-off:#11281A;
  --amber:#FFB020; --red:#FF5252; --green:#3DDC84; --on-amber:#1A1000;
  --wood:#2B1F18; --fret:#8E969E; --str:#BFC5CC;
  --stencil:'Big Shoulders Stencil Display','Arial Narrow',Impact,sans-serif;
  --lcdf:'Share Tech Mono',ui-monospace,Consolas,monospace;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--chassis);background-image:radial-gradient(90% 60% at 50% -10%,#1F2328 0%,var(--chassis) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.wrap{padding-block:22px 56px}}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin:0;font-family:var(--stencil);font-weight:800;font-size:40px;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.brand .led{width:12px;height:12px}
.brand small{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--silk);display:block;margin-top:2px}
.status{display:flex;align-items:center;gap:10px}
button.mini-lcd{border:0;cursor:pointer;text-align:left}
.mini-lcd{display:flex;align-items:center;gap:8px;background:var(--lcd);border-radius:8px;padding:4px 12px;min-height:44px;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 0 0 1px #000}
.mini-lcd b{font:400 30px/1 var(--lcdf);color:var(--lcd-ink);text-shadow:0 0 8px rgba(134,255,186,.4)}
.mini-lcd span{font-size:10px;line-height:1.15;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--silk)}
.tog{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:8px 14px;border-radius:9px;background:linear-gradient(#30353B,#25292E);border:1px solid var(--edge);box-shadow:0 3px 0 #08090A;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.tog:active{transform:translateY(2px);box-shadow:0 1px 0 #08090A}
.micnote{margin-top:12px;padding:12px 14px;border-radius:10px;background:#2A1A10;border:1px solid #5A3418;color:#FFD9B8;font-size:14px}

/* navegação */
#tabs{display:flex;gap:6px;margin:18px 0 20px}
#tabs button{display:flex;align-items:center;gap:8px;min-height:44px;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 14px;color:var(--silk);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#tabs button:hover{color:var(--ink)}
#tabs button[aria-selected="true"]{color:var(--ink);background:var(--raised);border-color:var(--edge);box-shadow:inset 0 -2px 0 var(--amber)}
#tabs .ts{display:none}
@media (min-width:900px) and (max-width:1100px){#tabs{gap:2px}#tabs button{padding:8px 9px;letter-spacing:.04em}}
@media (max-width:899px){
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:2px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:#0B0D0F;border-top:1px solid var(--edge);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  #tabs button{flex-direction:column;justify-content:center;gap:3px;min-height:54px;padding:4px 0;font-size:10px;letter-spacing:0;text-transform:none;border-radius:8px;min-width:0}
  #tabs .tl{display:none}#tabs .ts{display:block;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
  #tabs button[aria-selected="true"]{box-shadow:inset 0 2px 0 var(--amber)}
}

/* rack */
.rack{position:relative;display:flex;flex-direction:column;gap:16px;padding:20px 18px 18px;border-radius:14px;background:linear-gradient(180deg,#24282D,#1A1D21);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.4);min-width:0}
.rack::before,.rack::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6E757E,#2A2E33)}
.rack::before{left:8px}.rack::after{right:8px}
.rack-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-inline:6px}
h2{font-family:var(--stencil);font-weight:800;font-size:32px;line-height:1;margin:3px 0 0;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.silk{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--silk)}
.lvlleds{display:flex;gap:5px;padding-top:8px;flex:none}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.narrow{max-width:700px;margin:0 auto;width:100%}
.hint{font-size:13px;color:var(--silk)}
.center{text-align:center}

/* leds */
.led{display:inline-block;width:11px;height:11px;border-radius:50%;background:#3B2E14;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);flex:none}
.led.on{background:var(--amber);box-shadow:0 0 9px var(--amber),inset 0 0 2px #fff}
#duoBtn.on .led{background:var(--green);box-shadow:0 0 12px var(--green),inset 0 0 2px #fff}
#duoBtn.wait .led{background:var(--amber);box-shadow:0 0 9px var(--amber)}
.drow{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end;padding-top:10px;border-top:1px solid var(--edge)}
.drow b{padding-bottom:12px}
@media (max-width:520px){.drow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.drow b{grid-column:1/-1;padding:0}}
.tog.on .led,.foot.on .led{background:var(--red);box-shadow:0 0 12px var(--red),inset 0 0 2px #fff}

/* visor lcd */
.lcd{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:10px;background:radial-gradient(120% 140% at 50% 0%,#0E2116,var(--lcd));box-shadow:inset 0 2px 12px rgba(0,0,0,.85),0 0 0 1px #000,0 1px 0 rgba(255,255,255,.05);color:var(--lcd-ink);font-family:var(--lcdf);min-width:0}
.lcd b,.lcd div,.lcd span{text-shadow:0 0 8px rgba(134,255,186,.3)}
.lcd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lcd-big{font-size:88px;line-height:.85;font-variant-numeric:tabular-nums}
.lcd-huge{font-size:clamp(96px,28vw,176px);line-height:.85;font-variant-numeric:tabular-nums}
.lcd-mid{font-size:38px;line-height:1.05;white-space:nowrap}
.lcd-s{font-size:13px;opacity:.72;text-transform:uppercase;letter-spacing:.08em}
.lcd-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.lcd-strip{border-top:1px solid var(--lcd-dim);padding-top:9px;font-size:14px;opacity:.9}
.lcd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.lcd-list{margin:6px 0 0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.lcd .led{background:var(--lcd-off);box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.lcd .led.on{background:var(--lcd-ink);box-shadow:0 0 12px var(--lcd-ink)}
.lcd .led.acc.on{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.beats{display:flex;align-items:center;gap:12px;min-height:24px}
.beats .led{width:16px;height:16px}.beats .led.acc{width:22px;height:22px}
.beats.big{justify-content:center;gap:16px;min-height:36px}
.beats.big .led{width:24px;height:24px}.beats.big .led.acc{width:34px;height:34px}

/* controles */
.ctl{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:14px;align-items:center}
.knob{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#59606A,#23272C 70%);border:1px solid #0A0B0D;box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);font-size:30px;font-weight:600;line-height:1}
.knob:active{transform:translateY(2px)}
.ctl-mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl-mid input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.ctl-fine{display:flex;justify-content:space-between;align-items:center}
.ctl-fine button{min-height:36px;padding:4px 12px;border-radius:7px;background:transparent;border:1px solid var(--edge);color:var(--silk);font:15px var(--lcdf)}
.foot{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:78px;padding:8px 16px;border-radius:12px;background:linear-gradient(180deg,#43494F,#2B2F35);border:1px solid #4E555E;box-shadow:0 5px 0 #08090A,inset 0 1px 0 rgba(255,255,255,.12);font-family:var(--stencil);font-weight:800;font-size:clamp(21px,5.6vw,29px);letter-spacing:.08em;text-transform:uppercase;transition:transform .05s,box-shadow .05s}
.foot:active{transform:translateY(4px);box-shadow:0 1px 0 #08090A}
.foot .led{width:15px;height:15px}
.kbd{font:600 11px var(--body);letter-spacing:.08em;color:var(--silk);border:1px solid var(--edge);border-radius:5px;padding:2px 7px}
@media (max-width:899px),(hover:none){.kbd{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:10px;background:linear-gradient(#30353B,#262A2F);border:1px solid var(--edge);box-shadow:0 3px 0 #08090A;font-weight:700;font-size:14px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #08090A}
.btn.big{min-height:62px;font-size:16px}
.row .btn.big{flex:1 1 160px}
.seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:#0C0E10;border:1px solid var(--edge)}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border:0;border-radius:8px;background:transparent;color:var(--silk);font-weight:700;font-size:13px;padding:6px 6px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge),inset 0 -2px 0 var(--amber)}
.label-row{display:flex;flex-direction:column;gap:8px}
.drawer{border-top:1px solid var(--edge)}
.drawer summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:48px;padding-inline:4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--silk)}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary::after{content:"+";font:22px var(--lcdf)}
.drawer[open] summary::after{content:"−"}
.drawer-body{padding:2px 4px 8px}
.field{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silk)}
.field select,.field input{min-height:46px;padding:8px 10px;border-radius:9px;background:#0C0E10;border:1px solid var(--edge);font:500 15px var(--body);letter-spacing:0;text-transform:none;color:var(--ink);min-width:0;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--amber);flex:none}
.tips{margin:8px 0 0;padding-left:18px;color:var(--silk);display:flex;flex-direction:column;gap:6px}

/* tablatura e braço */
.sheet{position:relative;display:flex;flex-direction:column;gap:10px;max-height:300px;overflow:auto;padding:10px;border-radius:10px;background:#0C0E10;border:1px solid var(--edge)}
.bar{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),1.55em);grid-auto-columns:2em;width:max-content;padding:4px 6px;border-radius:7px;font:16px/1.55em var(--lcdf)}
.bar.cur{background:#1A1D21;box-shadow:inset 0 0 0 1px var(--edge)}
.c{text-align:center;white-space:nowrap}
.c.s{background:linear-gradient(#3A4048,#3A4048) center/100% 1px no-repeat}
.c.s b{font-weight:400;padding:0 3px;border-radius:3px;background:#0C0E10}
.bar.cur .c.s b{background:#1A1D21}
.c.t{color:var(--silk);font-size:12px}
.c.lab{color:var(--silk);background:none;padding-right:8px}
.c.bl{box-shadow:inset 1px 0 0 #4A5058}
.c.g b{color:var(--silk)}
.bar .c.on b{background:var(--amber);color:var(--on-amber)}
.c.t.on{color:var(--amber)}
.scroll{overflow-x:auto}
.fb{display:block;width:100%;min-width:620px;height:auto}
.fb .wood{fill:var(--wood)}.fb .fret{stroke:var(--fret);stroke-width:2}.fb .nut{stroke:#D8D2C2;stroke-width:4}
.fb .str{stroke:var(--str);opacity:.8}.fb .mk{fill:#D8D2C2;opacity:.3}.fb text{fill:var(--silk);font:600 11px var(--lcdf)}
.fb .ghostdot{fill:none;stroke:var(--silk);stroke-width:1.2;opacity:.65}
.fb .dot{fill:var(--lcd-ink)}.fb .dot.root{fill:var(--amber)}.fb .dot.now{stroke:#fff;stroke-width:3}
.fb .lbl{fill:#06120B;font:700 9px var(--body);text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--silk);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* medidor de afinação */
.ledmeter{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px}
.ledmeter i{height:22px;border-radius:3px;background:#2A1416}
.ledmeter i.a{background:#2A2210}.ledmeter i.c{background:#10291A}
.ledmeter i.r.on{background:var(--red);box-shadow:0 0 10px var(--red)}
.ledmeter i.a.on{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.ledmeter i.c.on{background:var(--green);box-shadow:0 0 14px var(--green)}
.ledmeter.big i{height:44px}
.meter-scale{display:flex;justify-content:space-between;margin-top:6px}
.pat{display:flex;flex-wrap:wrap;gap:6px}
.pat span{min-width:36px;text-align:center;padding:7px 8px;border-radius:7px;background:#0C0E10;border:1px solid var(--edge);color:var(--silk);font:15px var(--lcdf)}
.pat span.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.dyn{position:relative;height:10px;border-radius:5px;background:var(--lcd-off);overflow:hidden}
.dyn i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber)}
.breath{position:relative;display:grid;place-items:center;height:250px}
.breath .ring{position:absolute;width:210px;height:210px;border-radius:50%;border:1px dashed var(--lcd-dim)}
.breath .orb{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(134,255,186,.55),rgba(134,255,186,.08) 70%);box-shadow:0 0 40px rgba(134,255,186,.3);transform:scale(.4)}
.btxt{position:relative;text-align:center}
.btxt b{display:block;font-weight:400;font-size:64px;line-height:1}

/* páginas */
.area{display:grid;grid-template-columns:310px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;gap:10px}
.picker{display:none}
@media (max-width:899px){.area{grid-template-columns:minmax(0,1fr)}.side{display:none}.picker{display:flex;justify-content:space-between;width:100%}}
.xlist{display:flex;flex-direction:column}
.grp{margin:12px 0 4px 10px}
.xi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;min-height:58px;padding:11px 10px;text-align:left;background:transparent;border:0;border-top:1px solid var(--edge)}
.xi:hover{background:var(--raised)}
.xi[aria-current="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--amber)}
.xi b{font-weight:700}
.xi .lvlleds{padding-top:5px}
.xi small{grid-column:1/-1;color:var(--silk);font-size:12.5px}
.sov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.65)}
.sov-in{width:100%;max-height:86%;overflow:auto;border-radius:16px 16px 0 0;background:var(--panel);border-top:1px solid var(--edge);padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sov-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:12px 0;background:var(--panel)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:899px){.two{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:8px 6px;border-top:1px solid var(--edge)}
.st .n{font:14px var(--lcdf);color:var(--silk)}
.st small{display:block;color:var(--silk);font-size:12px}
.st .m{font:15px var(--lcdf);color:var(--lcd-ink)}
.cal{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px}
.cal i{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--lcd-off)}
.cal i.l1{background:#2B7D50}.cal i.l2{background:#4FC583}.cal i.l3{background:var(--lcd-ink);box-shadow:0 0 8px var(--lcd-ink)}
.cal i.today{outline:2px solid var(--amber);outline-offset:2px}
.prog{display:flex;flex-wrap:wrap;gap:7px}
.prog .led.done{background:var(--lcd-dim)}
.prog .led.on{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}
.pad{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:76px;border-radius:11px;background:linear-gradient(#33393F,#24282D);border:1px solid var(--edge);box-shadow:0 4px 0 #08090A;font:800 28px/1 var(--stencil)}
.pad small{font:13px var(--lcdf);color:var(--silk);margin-top:4px}
.pad:active{transform:translateY(3px);box-shadow:0 1px 0 #08090A}
.verdict{min-height:1.2em;font-family:var(--stencil);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.vtype{font-family:var(--stencil);font-weight:800;font-size:clamp(48px,12vw,78px);line-height:.95;letter-spacing:.03em;text-transform:uppercase;color:var(--amber);text-shadow:0 0 22px rgba(255,176,32,.25)}
.vchart{display:block;width:100%;min-width:520px;height:auto}
.vchart text{fill:var(--silk);font:600 11px var(--body)}
.vchart .tick{stroke:var(--edge)}
.vchart .mine{fill:rgba(134,255,186,.13);stroke:var(--lcd-ink);stroke-width:1.5}
.vchart .tr{stroke:var(--silk);stroke-width:6;stroke-linecap:round;opacity:.55}
.vchart .tr.best{stroke:var(--amber);opacity:1}
.vchart .sp{stroke:#fff;stroke-width:2.5;stroke-dasharray:4 3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:#0C0E10;border:1px solid var(--edge);color:var(--silk);font-weight:700;font-size:13px}

/* ---------- geradores de tablatura ---------- */
const md12=x=>((x%12)+12)%12;
function placeNear(m,T,near){let best=null,bs=1e9;T.forEach((o,s)=>{const f=m-o;if(f<0||f>17)return;const sc=Math.abs(f-near)+s*0.01;if(sc<bs){bs=sc;best={s,f}}});return best||{s:0,f:Math.max(0,m-T[0])}}
function scaleUp(T,key,scale,nps){
  const s0=T[0]===23?1:0;
  for(let r=md12(key-T[s0]);r<24;r+=12){
    const root=T[s0]+r,deg=[];for(let o=-1;o<5;o++)for(const iv of scale)deg.push(root+o*12+iv);
    const k0=deg.indexOf(root),out=[];let k=k0;
    for(let s=s0;s<T.length;s++)for(let j=0;j<nps;j++){const m=deg[k++];out.push({s,f:m-T[s],root:pc(m)===pc(key)})}
    if(s0){let kk=k0-1;for(let j=0;j<nps;j++){const m=deg[kk--];out.unshift({s:0,f:m-T[0],root:pc(m)===pc(key)})}}
    if(out.every(n=>n.f>=0))return out;
  }
}
function rootPos(T,key){let f=md12(key-T[0]);if(f<=7)return{s:0,f};return{s:1,f:md12(key-T[1])}}
function genNotes(ex,inst,key){
  const T=TUN[inst],n=T.length,out=[];
  const g=ex.gen;
  if(g==='crom'){const p=1;for(let s=0;s<n;s++)for(let f=p;f<p+4;f++)out.push({s,f});for(let s=n-1;s>=0;s--)for(let f=p+3;f>=p;f--)out.push({s,f})}
  else if(g==='alt'||g==='dedos'){const s=T.indexOf(inst==='guitarra'?55:33);[5,5,5,5,7,7,7,7,8,8,8,8,7,7,7,7].forEach((f,i)=>out.push({s,f,t:g==='alt'?(i%2?'↑':'↓'):(i%2?'m':'i')}))}
  else if(g==='oct'){for(const off of [0,5,7,0]){const r=rootPos(T,key+off);for(let i=0;i<4;i++){out.push({s:r.s,f:r.f,root:true});out.push({s:r.s+2,f:r.f+2})}}}
  else if(g==='scale'){const up=scaleUp(T,key,ex.scale,ex.nps);out.push(...up,...up.slice(1,-1).reverse())}
  else if(g==='spider'){const p=1;for(let s=0;s<n-1;s++)out.push({s,f:p},{s:s+1,f:p+1},{s,f:p+2},{s:s+1,f:p+3});for(let s=n-2;s>=0;s--)out.push({s:s+1,f:p+3},{s,f:p+2},{s:s+1,f:p+1},{s,f:p})}
  else if(g==='legato'){for(let s=0;s<n;s++)out.push({s,f:5},{s,f:7,t:'h'},{s,f:5,t:'p'},{s,f:7,t:'h'},{s,f:5},{s,f:8,t:'h'},{s,f:5,t:'p'},{s,f:8,t:'h'})}
  else if(g==='arp'){const b=inst==='guitarra'?1:0;for(const off of [0,5,7,0]){let rf=md12(key+off-T[b]);if(inst==='guitarra'&&rf<2)rf+=12;const rm=T[b]+rf;out.push({s:b,f:rf,root:true});for(const iv of [4,7,12])out.push({...placeNear(rm+iv,T,rf),root:iv===12})}}
  else if(g==='skip'){const up=scaleUp(T,key,ex.scale,2),by=[];up.forEach(x=>(by[x.s]=by[x.s]||[]).push(x));for(let s=0;s<n-2;s++)out.push(by[s][0],by[s+2][0],by[s][1],by[s+2][1]);for(let s=n-3;s>=0;s--)out.push(by[s+2][1],by[s][1],by[s+2][0],by[s][0])}
  else if(g==='seq3'){const up=scaleUp(T,key,ex.scale,ex.nps);for(let i=0;i<up.length-2;i++)out.push(up[i],up[i+1],up[i+2])}
  else if(g==='slap'){for(const off of [0,0,5,7]){const r=rootPos(T,key+off),R={s:r.s,f:r.f,t:'T',root:true},O={s:r.s+2,f:r.f+2,t:'P'},X={s:r.s,f:null,t:'x',ghost:true};out.push(R,X,O,X,R,R,O,X)}}
  else if(g==='ghost'){for(const off of [0,5]){const r=rootPos(T,key+off),R={s:r.s,f:r.f,root:true},X={s:r.s,f:null,t:'x',ghost:true},F={s:r.s+1,f:r.f},S7={s:r.s+2,f:r.f},O={s:r.s+2,f:r.f+2};out.push(R,X,R,X,R,X,F,X,F,X,S7,X,O,X,F,X)}}
  else if(g==='sweep'){for(const off of [0,5,7,0]){const tri=[0,4,7].map(i=>pc(key+off+i));let f0=4;while(!tri.includes(pc(T[3]+f0)))f0++;const a={s:3,f:f0};const pick=(s,prev)=>{for(let f=0;f<18;f++){const m=T[s]+f;if(m>prev&&tri.includes(pc(m)))return{s,f}}};const am=T[3]+f0,b=pick(4,am),c=pick(5,T[4]+b.f);const mk=(x,t)=>({...x,t,root:pc(T[x.s]+x.f)===tri[0]});for(let r=0;r<2;r++)out.push(mk(a,'↓'),mk(b,'↓'),mk(c,'↓'),mk(b,'↑'))}}
  else if(g==='walk'){const ch=[[0,4],[9,3],[2,3],[7,4]],low=x=>T[0]+md12(x-T[0]);
    const put=(m,t,root)=>out.push({...placeNear(m,T,5),t,root});
    for(let v=0;v<2;v++)ch.forEach(([off,third],i)=>{const r=low(key+off),nx=low(key+ch[(i+1)%4][0]);
      put(r,'R',true);if(v===0){put(r+third,'3');put(r+7,'5')}else{put(r+2,'2');put(r+third,'3')}put(nx-1,'→')})}
  out.forEach(x=>{if(x.f!=null&&x.root===undefined)x.root=pc(T[x.s]+x.f)===pc(key)});
  return out;
}

const dayKey=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
function streak(){let n=0;const d=new Date();if(!H.days[dayKey(d)])d.setDate(d.getDate()-1);while(H.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}

/* último resultado de um exercício: acerto (só quando o MIC mediu) e BPM */
function exStat(id){const r=H.ex[id];if(!r||!r.n)return null;const lg=r.log||[],la=lg[lg.length-1],lastA=[...lg].reverse().find(e=>e.a!=null);
  return {n:r.n,max:r.max,last:r.last||(la&&la.d),acc:lastA?lastA.a:null,accDay:lastA&&lastA.d}}
/* treino de ouvido: uma entrada de log por dia, com acerto do dia, e contagem por item (intervalo, acorde…) */
function earMark(id,item,ok){const r=exRec(id),d=dayKey(),it=(r.items=r.items||{})[item]||(r.items[item]={n:0,ok:0});it.n++;if(ok)it.ok++;r.last=d;
  const lg=r.log||(r.log=[]);let e=lg[lg.length-1];if(!e||e.d!==d){e={d,k:0,ok:0};lg.push(e);r.n++;if(lg.length>40)lg.shift()}
  e.k++;if(ok)e.ok++;e.a=Math.round(e.ok/e.k*100);saveH()}

let AC=null,MASTER=null,NOISE=null;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(comp);comp.connect(AC.destination);
    NOISE=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC;
}
function env(g,t,vel,att,dur,rel){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vel,t+att);g.gain.setValueAtTime(vel,t+Math.max(att,dur-0.02));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+rel)}
function tone(m,t,dur,vel,bus){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='triangle';o.frequency.value=mf(m);o2.type='sine';o2.frequency.value=mf(m)*2;g2.gain.value=.18;lp.type='lowpass';lp.frequency.value=Math.min(6000,mf(m)*6);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(bus||MASTER);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vel,t+.015);g.gain.exponentialRampToValueAtTime(vel*.45,t+.35);g.gain.setValueAtTime(vel*.45,t+Math.max(.36,dur-.03));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.12);
  o.start(t);o2.start(t);o.stop(t+dur+.15);o2.stop(t+dur+.15)}
function pluck(m,t,dur,vel,bus){const f=mf(m),o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.Q.value=2;

  job.ui=(t,fn)=>{const id=setTimeout(()=>{if(JOB===job)fn()},Math.max(0,(t-AC.currentTime)*1000));job.timeouts.push(id);if(job.timeouts.length>600)job.timeouts.splice(0,300)};

    if(j.exId){const e=exRec(j.exId);e.n++;e.last=dayKey();if(j.maxBpm)e.max=Math.max(e.max,j.maxBpm);
      const a=j.acc&&j.acc(),b=j.maxBpm||j.bpm,le={};if(a&&a.n>=15)le.a=a.p;if(b)le.b=b;logEx(j.exId,le)}
    saveH();renderStreak()}

const MIC={on:false,an:null,buf:null,freq:null,hist:[],last:0};

  if(MIC.on){MIC.stream.getTracks().forEach(t=>t.stop());MIC.on=false;MIC.freq=null;updateMicBtn();onPitch&&onPitch(null);return}
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('sem suporte');
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac();const src=AC.createMediaStreamSource(stream);const an=AC.createAnalyser();an.fftSize=4096;src.connect(an);
    Object.assign(MIC,{on:true,stream,an,buf:new Float32Array(an.fftSize)});$('#micNote').hidden=true;updateMicBtn();requestAnimationFrame(micLoop);
  }catch(e){
    const n=$('#micNote');n.hidden=false;
    n.textContent='O microfone não abriu aqui. Dentro do Claude o navegador bloqueia o acesso ao microfone; abra o arquivo aquece.html que te mandei no Chrome (PC ou celular) e permita o microfone quando ele pedir. Todo o resto funciona normalmente por aqui.';
  }

function detect(buf,sr){
  const half=buf.length>>1,b=new Float32Array(half);for(let i=0;i<half;i++)b[i]=(buf[2*i]+buf[2*i+1])/2;sr/=2;
  let rms=0;for(let i=0;i<half;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/half);if(rms<.006)return null;
  const maxLag=Math.min(half-2,Math.floor(sr/38)),minLag=Math.floor(sr/1400),c=new Float32Array(maxLag+2);
  for(let l=0;l<=maxLag+1;l++){let s=0;for(let j=0;j<half-l;j++)s+=b[j]*b[j+l];c[l]=s*half/(half-l)}
  let d=minLag;while(d<maxLag&&c[d]>c[d+1])d++;let mv=-Infinity,mp=-1;for(let i=d;i<=maxLag;i++)if(c[i]>mv){mv=c[i];mp=i}

  const x1=c[mp-1],x2=c[mp],x3=c[mp+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;const T0=a?mp-bb/(2*a):mp;return sr/T0;

    if(f){MIC.hist.push(f);if(MIC.hist.length>5)MIC.hist.shift();const s=[...MIC.hist].sort((a,b)=>a-b);MIC.freq=s[s.length>>1]}else{MIC.hist=[];MIC.freq=null}

/* ---------- pareamento com o DuoDesk ----------
   O DuoDesk (mixer da M-Track) roda um servidor na porta 47800 quando o botão "Aquece" está ligado lá.
   /ola devolve modelo, canais e cenas; /eventos manda a frequência da entrada pedida ~20x/s (Server-Sent Events);
   /cena carrega uma cena. Conectado, o DuoDesk vira a fonte de som no lugar do microfone do aparelho. */
S.duo=Object.assign({host:'127.0.0.1:47800',code:'',auto:false,ch:{voz:0,ouvido:0,baixo:1,guitarra:1},scenes:{}},S.duo||{});
const DUO={st:'off',info:null,es:null,ch:-1,freq:null,last:0,err:'',area:null};
const hearing=()=>MIC.on||DUO.st==='on';
const srcName=()=>DUO.st==='on'?'M-Track':'MIC';
const duoUrl=(path,extra='')=>`http://${S.duo.host.trim()}/${path}?codigo=${encodeURIComponent(S.duo.code.trim())}${extra}`;
async function duoConnect(){
  duoClose();DUO.st='wait';DUO.err='';updateDuoBtn();
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),3000);
    const r=await fetch(duoUrl('ola'),{signal:ctl.signal,cache:'no-store'});clearTimeout(t);
    if(r.status===403)throw new Error('O código não confere. Veja o código no botão Aquece do DuoDesk.');
    if(!r.ok)throw new Error('O DuoDesk respondeu com erro '+r.status+'.');

  }catch(e){DUO.st='off';DUO.err=e.message&&!/fetch|abort|network/i.test(e.message)?e.message:
    location.protocol==='https:'?'Esta versão (aberta por https) não consegue falar com o DuoDesk. Use o Aquece.exe ou o app Android.':'Não achei o DuoDesk nesse endereço. Confira se ele está aberto, com o botão Aquece ligado, e se os dois estão na mesma rede.'}
  updateDuoBtn();return DUO.st==='on'}

  if(DUO.st!=='on'||(DUO.es&&DUO.ch===ch))return;if(DUO.es)DUO.es.close();DUO.ch=ch;
  const es=DUO.es=new EventSource(duoUrl('eventos','&canal='+ch));
  es.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}DUO.last=performance.now();DUO.used=d.canal;DUO.freq=d.hz>0?d.hz:null;onPitch&&onPitch(DUO.freq)};
  es.onerror=()=>{if(es!==DUO.es)return;if(es.readyState===2){duoClose();DUO.err='A conexão com o DuoDesk caiu.';updateDuoBtn();onPitch&&onPitch(null)}};

async function duoScene(name){if(DUO.st!=='on'||!name)return false;try{const r=await fetch(duoUrl('cena','&nome='+encodeURIComponent(name)));return r.ok}catch(e){return false}}

  let s=`<svg class="vchart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Sua extensão comparada às classificações de voz">`;
  for(let m=36;m<=84;m+=12)s+=`<line class="tick" x1="${sx(m)}" x2="${sx(m)}" y1="${top-4}" y2="${bot}"/><text x="${sx(m)}" y="${Hh-6}" text-anchor="middle">${nn(m)}</text>`;
  s+=`<rect class="mine" x="${sx(v.lo)}" y="${top-4}" width="${Math.max(2,sx(v.hi)-sx(v.lo))}" height="${bot-top+4}" rx="4"/>`;
  VTYPES.forEach((t,i)=>{const y=top+i*rowH+rowH/2;s+=`<text x="0" y="${y+4}">${t.n}</text><line class="tr${t===best?' best':''}" x1="${sx(t.r[0])}" x2="${sx(t.r[1])}" y1="${y}" y2="${y}"/>`});

function fitSong(sg,lo,hi){
  let best=null;
  for(let t=-17;t<=17;t++){const a=sg.lo+t,b=sg.hi+t;if(a<lo||b>hi)continue;const at=Math.abs(t),cost=at>=7?Math.abs(at-12)+1.5:at,margin=Math.min(a-lo,hi-b);
    if(!best||cost<best.cost||(cost===best.cost&&margin>best.margin))best={t,cost,margin,fit:true}}
  if(best)return best;
  const over=(sg.hi-sg.lo)-(hi-lo);if(over>3)return null;
  let t=Math.round((lo+hi)/2-(sg.lo+sg.hi)/2);if(t>=7)t-=12;else if(t<=-7)t+=12;
  if(sg.lo+t<lo-4||sg.hi+t>hi+4){t=Math.round((lo+hi)/2-(sg.lo+sg.hi)/2)}
  return {t,cost:10+over,fit:false,over};
}

function spread(arr,k){if(k>=arr.length)return arr.slice();const out=[];for(let i=0;i<k;i++)out.push(arr[Math.round(i*(arr.length-1)/Math.max(1,k-1))]);return [...new Set(out)]}

/* sobe o BPM quando o último resultado foi bom: acerto ≥ 85% medido pelo MIC, ou 3+ vezes no BPM atual sem MIC */
function rtBpm(e,a){if(!e.bpm||e.kind==='breath'||e.kind==='siren'||e.kind==='ear')return null;const st=exStat(e.id);if(!st)return null;
  const p=S.params[a==='voz'||e.kind==='chords'?e.id:e.id+':'+a],cur=p&&p.bpm||e.bpm,cap=e.bpm+(a==='voz'?24:60);if(cur+4>cap)return null;
  const lastB=(H.ex[e.id].log||[]).slice(-1)[0];const good=st.acc!=null?st.acc>=85&&st.accDay===st.last:st.n>=3&&lastB&&lastB.b>=cur;

function buildRoutine(){const {lvl,areas,min}=S.rt,smart=S.rt.smart!==false;const sel=AREAS.filter(a=>areas[a]);if(!sel.length)return[];const per=min/sel.length,steps=[];

    const list=EX.filter(e=>e.area.includes(a)&&e.lvl<=L&&e.kind!=='test').sort((x,y)=>x.lvl-y.lvl);const k=Math.max(2,Math.min(list.length,Math.round(per/2.5)));let pick,why={};
    const br=a==='voz'?list.find(e=>e.kind==='breath'):null,rest_=br?list.filter(e=>e.kind!=='breath'):list,kk=br?k-1:k;
    if(smart){const sc=rest_.map((e,i)=>({e,i,...rtScore(e,L)}));sc.sort((x,y)=>y.s-x.s||x.i-y.i);const top=sc.slice(0,kk).sort((x,y)=>x.e.lvl-y.e.lvl||x.i-y.i);top.forEach(x=>why[x.e.id]=x.why);pick=top.map(x=>x.e)}

/* sugestão de nível: sobe quando boa parte do nível atual está firme, desce quando o acerto médio está baixo */

    const st=cur.map(e=>exStat(e.id)).filter(Boolean),good=st.filter(s=>s.acc!=null?s.acc>=80:s.n>=3).length,accs=st.filter(s=>s.acc!=null).map(s=>s.acc),avg=accs.length?accs.reduce((x,y)=>x+y,0)/accs.length:null;

  go.onclick=()=>{if(JOB&&JOB.owner==='metro'){stopJob();return}

    startJob({owner:'metro',schedule(until){while(this.next<until){const t=this.next,sub=gr?gr.steps/4:p.sub,b=Math.floor(i/sub)%beats,on=i%sub===0;
      if(gr)drumStep(gr,i,t,this.bus);else click(t,on?(b===0?2:1):0,this.bus);if(on)this.ui(t,()=>lightBeat(be,b));

      if(!p.trainer)bpm=p.bpm;}},
      onStart(){setFoot(go,true,'Parar')},onStop(){setFoot(go,false,'Começar');lightBeat(be,-1);$('#mcnt').innerHTML='&nbsp;';show(p.bpm)}})};
}

/* ---------- treino de ouvido ---------- */
const IVN=['Uníssono','2ª menor','2ª maior','3ª menor','3ª maior','4ª justa','Trítono','5ª justa','6ª menor','6ª maior','7ª menor','7ª maior','Oitava'];
const IVS=['1','2m','2M','3m','3M','4J','4aum','5J','6m','6M','7m','7M','8J'];
const CHN={'':'Maior',m:'Menor',dim:'Diminuta',aug:'Aumentada','7':'Dominante 7',maj7:'Sétima maior',m7:'Menor com 7ª',m7b5:'Meio-diminuta'};
const CHS={'':'M',m:'m',dim:'°',aug:'+','7':'7',maj7:'7M',m7:'m7',m7b5:'ø'};
const MOVDO=['dó','ré','mi','fá','sol','lá','si','dó'];
const rnd=n=>Math.floor(Math.random()*n);
function earItemName(ex,it){return ex.mode==='chord'?CHN[it]:ex.mode==='dict'?`melodia de ${it} notas`:IVN[+it]}
/* sorteio que puxa mais o que você erra: peso maior para itens com acerto baixo */
function earPick(ex){const r=H.ex[ex.id],items=(r&&r.items)||{};
  const w=ex.set.map(k=>{const s=items[k];return 1+2*(s?1-(s.ok+1)/(s.n+2):.5)});let x=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return ex.set[i]}return ex.set[ex.set.length-1]}
function earStatsHTML(ex){const r=H.ex[ex.id];if(!r||!r.items)return '';
  const rows=Object.entries(r.items).map(([k,s])=>({k,s,p:Math.round(s.ok/s.n*100)})).sort((a,b)=>a.p-b.p);
  return `<div class="silk" style="margin-top:12px">Seu acerto por item</div><div class="estats">${rows.map(x=>`<div><span>${earItemName(ex,x.k)}</span><span class="${x.p>=80?'g':x.p<50?'r':''}">${x.s.ok}/${x.s.n} · ${x.p}%</span></div>`).join('')}</div>`}

function earPlayer(box,ex,opts={}){

  box.innerHTML=`<div class="rack">${rackHead(ex,LVL[ex.lvl]+' · Ouvido')}
   <div class="lcd"><div class="lcd-grid"><div><div class="lcd-s">Acertos</div><div class="lcd-mid" data-sc>0/0</div></div><div><div class="lcd-s">Sequência</div><div class="lcd-mid" data-run>0</div></div><div><div class="lcd-s" data-ql>${sing?'Você':'Pergunta'}</div><div class="lcd-mid" data-q>—</div></div></div><div class="lcd-strip" data-st>${intro}</div></div>
   ${sing?meterHTML('em'):''}
   <div class="verdict" data-vd>&nbsp;</div>
   ${footHTML('Começar')}
   ${sing?'<div class="row"><button class="btn big" type="button" data-ans disabled>Ouvir a resposta</button></div><div class="row" data-self hidden><button class="btn big" type="button" data-y>Acertei</button><button class="btn big" type="button" data-nn>Errei</button></div>':''}
   ${mode==='dict'?'<div class="pat" data-given></div>':''}
   ${pads.length?`<div class="pads ear" data-pads>${pads.map(([v,l,s])=>`<button class="pad" type="button" data-a="${v}" disabled>${l}<small>${s}</small></button>`).join('')}</div>`:''}
   ${drawer('Como fazer',`<p>${ex.desc}</p>${sing?'<p class="hint" style="margin-top:8px">Use fone de ouvido para o microfone não escutar a nota do app. Cantar uma oitava acima ou abaixo também vale.</p>':''}${recLine(ex.id)}<div data-es>${earStatsHTML(ex)}</div>`)}
  </div>`;
  const go=$('[data-go]',box),scEl=$('[data-sc]',box),runEl=$('[data-run]',box),qEl=$('[data-q]',box),stEl=$('[data-st]',box),vdEl=$('[data-vd]',box),mEl=$('#em',box),givenEl=$('[data-given]',box),selfEl=$('[data-self]',box),ansB=$('[data-ans]',box);
  const vd=(h,c)=>{vdEl.innerHTML=h;vdEl.style.color=c||''};
  const enablePads=on=>$$('[data-a]',box).forEach(b=>{b.disabled=!on;if(on)b.classList.remove('ok','bad')});
  const play=()=>{if(q)playOnce(box,(t,bus)=>q.play(t,bus),q.len)};
  const showGiven=()=>{if(givenEl)givenEl.innerHTML=Array.from({length:ex.len},(_,i)=>`<span class="${i<given.length?'on':''}">${given[i]??'?'}</span>`).join('')};
  function newQ(){
    clearTimeout(timer);done=false;given=[];hold=0;vd('&nbsp;');
    if(mode==='int'){const iv=earPick(ex),d=ex.dir==='both'?['up','down'][rnd(2)]:ex.dir==='mix'?['up','down','harm'][rnd(3)]:ex.dir,a=d==='down'?52+rnd(10)+iv:50+rnd(12),b=d==='down'?a-iv:a+iv;
      q={item:String(iv),ans:IVN[iv],len:d==='harm'?1.8:2.2,txt:d==='up'?'subindo':d==='down'?'descendo':'juntas',
        play(t,bus){if(d==='harm'){tone(a,t,1.5,.24,bus);tone(b,t,1.5,.24,bus)}else{tone(a,t,.9,.3,bus);tone(b,t+1.05,1,.3,bus)}}}}
    else if(mode==='chord'){const k=earPick(ex),r=48+rnd(12),ns=CHQ[k].map(i=>r+i);
      q={item:k,ans:CHN[k],len:2.2+ns.length*.32,txt:'acorde',play(t,bus){ns.forEach(m=>tone(m,t,1.4,.15,bus));ns.forEach((m,i)=>tone(m,t+1.7+i*.32,.5,.22,bus))}}}
    else if(mode==='dict'){const k0=53+rnd(9),sc=MAJ.concat(12),deg=[0];
      while(deg.length<ex.len){const p0=deg[deg.length-1];let d;do{d=p0+rnd(5)-2}while(d<0||d>7||d===p0);deg.push(d)}
      q={item:String(ex.len),k0,sc,deg,ans:deg.map(d=>d+1).join(' '),len:1.6+deg.length*.65,txt:'melodia',
        play(t,bus){[0,4,7].forEach(i=>tone(k0+i,t,1,.12,bus));deg.forEach((d,i)=>tone(k0+sc[d],t+1.4+i*.65,.55,.3,bus))}};
      given=[1]}
    else{const [lo,hi]=RANGES[S.range]||RANGES.Tenor,iv=earPick(ex),span=Math.max(1,hi-iv-lo-1),r=lo+1+rnd(span),tg=r+iv;
      q={item:String(iv),target:tg,ref:r,ans:nn(tg),len:1.4,txt:iv?IVN[iv]+' acima':'mesma nota',play(t,bus){tone(r,t,1.2,.3,bus)}}}
    t0=performance.now();
    qEl.textContent=sing?'—':q.txt;
    stEl.textContent=sing?`Cante ${q.item==='0'?'a mesma nota':'a '+q.txt+' de '+nn(q.ref)}${hearing()?'':' · sem MIC: cante, ouça a resposta e marque'}`:mode==='dict'?'Toque os graus da melodia na ordem.':intro;
    enablePads(true);showGiven();setFoot(go,true,'Ouvir de novo');
    if(sing){ansB.disabled=false;selfEl.hidden=hearing();if(hearing())timer=setTimeout(()=>{if(!done)answer(false,'Não ouvi a nota certa a tempo. Ouça a resposta e tente de novo.')},12000)}
    play()}
  function answer(v,msg){
    if(done||!q)return;done=true;clearTimeout(timer);n++;if(v){ok++;run++}else run=0;
    addPractice('ouvido',Math.min(60,(performance.now()-t0)/1000));earMark(ex.id,q.item,v);renderStreak();
    vd(v?'Certo':'Era '+q.ans,v?'var(--green)':'var(--red)');stEl.textContent=msg||(v?'Muito bem. Toque em Próxima.':'Ouça de novo para comparar e siga para a próxima.');
    scEl.textContent=ok+'/'+n;runEl.textContent=run;setFoot(go,false,'Próxima');
    $$('[data-a]',box).forEach(b=>{b.disabled=true;if(mode!=='dict'&&b.dataset.a===q.item)b.classList.add('ok')});
    if(sing){selfEl.hidden=true}
    const es=$('[data-es]',box);if(es)es.innerHTML=earStatsHTML(ex)}
  $$('[data-a]',box).forEach(b=>b.onclick=()=>{if(done||!q)return;
    if(mode==='dict'){const d=+b.dataset.a;given.push(d);showGiven();ac();tone(q.k0+q.sc[d-1],AC.currentTime+.02,.5,.28);

    const right=b.dataset.a===q.item;if(!right)b.classList.add('bad');answer(right)});
  if(sing){
    ansB.onclick=()=>{if(!q)return;playOnce(box,(t,bus)=>tone(q.target,t,1.2,.3,bus),1.4)};
    $('[data-y]',box).onclick=()=>answer(true);$('[data-nn]',box).onclick=()=>answer(false);
    onPitch=f=>{if(!document.body.contains(box))return;if(!f||!q||done){setMeter(mEl,null);if(!f)hold=0;return}
      if(performance.now()-t0<1300)return;
      const m=f2m(f);let c=(m-q.target)*100;c-=Math.round(c/1200)*1200;setMeter(mEl,c);qEl.textContent=nn(Math.round(m));
      if(Math.abs(c)<=35){if(++hold>=8)answer(true,`Afinado em ${nn(Math.round(m))}.`)}else hold=0}}
  else onPitch=null;
  go.onclick=()=>{if(done)newQ();else play()};
  return {start:newQ};
}

/* ===== progresso.js ===== */
/* ---------- progresso ---------- */
function weekStart(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
/* segundos da semana (off = quantas semanas atrás), total e por área */
function weekSecs(off){const s=weekStart(new Date());s.setDate(s.getDate()-7*off);let t=0;const by={};
  for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const k=dayKey(d);t+=H.days[k]||0;const a=H.ad[k];if(a)for(const z in a)by[z]=(by[z]||0)+a[z]}
  return {t,by,start:s}}
function bestStreak(){let best=0,cur=0,prev=null;Object.keys(H.days).filter(k=>H.days[k]).sort().forEach(k=>{const d=new Date(k+'T12:00');cur=prev&&Math.round((d-prev)/864e5)===1?cur+1:1;best=Math.max(best,cur);prev=d});return best}
const ddmm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
function spark(vals,lo,hi){if(vals.length<2)return '<span class="hint">—</span>';const a=vals.slice(-12),W=96,h=28,x=i=>4+i*(W-8)/(a.length-1),y=v=>h-4-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo||1)*(h-8);
  return `<svg class="spark" viewBox="0 0 ${W} ${h}" aria-hidden="true"><polyline points="${a.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/><circle cx="${x(a.length-1)}" cy="${y(a[a.length-1])}" r="2.6"/></svg>`}
function weeksChart(goal){const wk=[...Array(8)].map((_,i)=>weekSecs(7-i)),mins=wk.map(w=>w.t/60),mx=Math.max(goal*1.15,...mins,1),W=320,h=130,B=18,bw=26,gap=(W-16-8*bw)/7,y=v=>h-B-v/mx*(h-B-12);
  let s=`<svg class="pchart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Minutos por semana nas últimas 8 semanas">`;
  wk.forEach((w,i)=>{const x=8+i*(bw+gap),m=mins[i],top=y(m);s+=`<rect class="${m>=goal?'hit':''}${i===7?' now':''}" x="${x}" y="${top}" width="${bw}" height="${Math.max(0,h-B-top)}" rx="3"/><text x="${x+bw/2}" y="${h-4}" text-anchor="middle">${ddmm(w.start)}</text>`;if(m>0)s+=`<text class="v" x="${x+bw/2}" y="${top-4}" text-anchor="middle">${Math.round(m)}</text>`});
  s+=`<line class="goal" x1="4" x2="${W-4}" y1="${y(goal)}" y2="${y(goal)}"/>`;
  return s+'</svg>'}
function voiceChart(T){const lo=Math.min(...T.map(t=>t.lo))-2,hi=Math.max(...T.map(t=>t.hi))+2,W=320,h=170,L=36,B=20,cw=(W-L-8)/Math.max(T.length,4),y=m=>8+(hi-m)/(hi-lo)*(h-B-8);
  let s=`<svg class="pchart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Sua extensão em cada teste de voz">`;
  for(let m=Math.ceil(lo/12)*12;m<=hi;m+=12)s+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y(m)}" y2="${y(m)}"/><text x="${L-6}" y="${y(m)+4}" text-anchor="end">${nn(m)}</text>`;
  T.forEach((t,i)=>{const x=L+i*cw+cw/2;s+=`<rect class="${i===T.length-1?'now':''}" x="${x-9}" y="${y(t.hi)}" width="18" height="${Math.max(3,y(t.lo)-y(t.hi))}" rx="4"/><text x="${x}" y="${h-5}" text-anchor="middle">${t.date.slice(8,10)}/${t.date.slice(5,7)}</text>`});

const KAR={song:null,pos:0,trace:[],hits:0,tot:0,live:null,raf:0,lyrKey:'',tgt:null,ended:false};

function parseMidi(buf){
  const d=new DataView(buf);let p=0;

function setMelody(song,k){

    <div class="label-row"><div class="silk">Velocidade</div>${seg([[.7,'70%'],[.85,'85%'],[1,'100%']],'data-ksp',S.kar.speed)}</div>

    <label class="check"><input type="checkbox" id="kaccomp" ${S.kar.acc?'checked':''}> Tocar o acompanhamento do arquivo</label>
    ${drawer('Faixa da melodia',`<label class="field">Qual faixa é a voz<select id="ktrack">${song.cands.map(c=>`<option value="${c.k}" ${c.k===song.melKey?'selected':''}>${esc(c.name)} · canal ${c.ch} · ${c.count} notas</option>`).join('')}</select></label><p class="hint" style="margin-top:8px">O app escolhe sozinho a faixa que mais parece a melodia cantada. Se a trilha não bater com a música, troque aqui.</p>`)}
    ${fileIn}</section></div>`;
  karBindFile();karInfo();
  const go=$('#kar [data-go]');
  go.onclick=()=>{if(JOB&&JOB.owner==='kar')stopJob();else karPlay()};
  const restartIfPlaying=fn=>{const was=JOB&&JOB.owner==='kar';if(was)stopJob();fn();if(was)karPlay()};
  $('#krst').onclick=()=>restartIfPlaying(()=>{KAR.pos=0;KAR.trace=[];KAR.hits=0;KAR.tot=0});
  $('#kseek').onchange=e=>restartIfPlaying(()=>{KAR.pos=+e.target.value/1000*song.dur;KAR.trace=[]});
  const updShift=()=>{$('#kshift').textContent=karShiftTxt();karInfo();save()};
  $$('[data-ks]').forEach(b=>b.onclick=()=>{S.kar.shift=Math.max(-24,Math.min(24,S.kar.shift+ +b.dataset.ks));updShift()});
  const fit=$('#kfit');if(fit)fit.onclick=()=>{S.kar.shift=autoShift(song);updShift()};
  $$('[data-ksp]').forEach(b=>b.onclick=()=>restartIfPlaying(()=>{S.kar.speed=+b.dataset.ksp;save();$$('[data-ksp]').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
  $$('[data-kg]').forEach(b=>b.onclick=()=>{S.kar.guide=+b.dataset.kg;save();$$('[data-kg]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#kaccomp').onchange=e=>{S.kar.acc=e.target.checked;save()};
  $('#ktrack').onchange=e=>restartIfPlaying(()=>{setMelody(song,e.target.value);KAR.trace=[];karInfo()});
  $('#kchange').onclick=()=>$('#kfile').click();
  onPitch=f=>{
    const you=$('#kyou');if(!you)return;
    if(!f){you.textContent='—';KAR.live=null;return}
    let m=f2m(f);const playing=JOB&&JOB.owner==='kar',t=karNow(),tg=melAt(song,t),sh=S.kar.shift;
    you.textContent=nn(Math.round(m));
    let hit=null;
    if(tg){const tm=tg.m+sh;m-=Math.round((m-tm)/12)*12;hit=Math.abs(m-tm)<=.5;if(playing){KAR.tot++;if(hit)KAR.hits++;$('#kacc').textContent=Math.round(KAR.hits/KAR.tot*100)+'%'}}
    else{const mid=(song.lo+song.hi)/2+sh;m-=Math.round((m-mid)/12)*12}
    KAR.live={m,at:performance.now(),hit};
    if(playing){KAR.trace.push({t,m,hit});if(KAR.trace.length>800)KAR.trace.splice(0,200)}
  };
  KAR.lyrKey='';KAR.tgt=undefined;karRender();
}
function karBindFile(){
  const inp=$('#kfile'),drop=$('#kar');
  inp.onchange=()=>{if(inp.files[0])karLoad(inp.files[0])};
  const go=$('#kar [data-go]');if(!KAR.song&&go)go.onclick=()=>inp.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)karLoad(f)};
}
function karRender(){
  const cv=$('#karcv');if(!cv||!KAR.song){KAR.raf=0;return}KAR.raf=requestAnimationFrame(karRender);
  const song=KAR.song,dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const now=karNow(),sh=S.kar.shift,minM=song.lo+sh-4,maxM=song.hi+sh+4,rows=maxM-minM,y=m=>H-10-(m-minM)/rows*(H-20),rowH=(H-20)/rows;
  const playX=Math.round(W*.28),pps=(W-playX)/5.5,x=t=>playX+(t-now)*pps,t0=now-playX/pps,t1=now+5.6;
  c.font='11px "Share Tech Mono",ui-monospace,monospace';
  for(let m=Math.ceil(minM);m<=maxM;m++){c.fillStyle=pc(m)===0?'rgba(134,255,186,.16)':'rgba(134,255,186,.05)';c.fillRect(0,Math.round(y(m)),W,1);if(pc(m)===0){c.fillStyle='rgba(134,255,186,.6)';c.fillText(nn(m),6,y(m)-3)}}
  for(const n of song.mel){if(n.t+n.d<t0)continue;if(n.t>t1)break;const m=n.m+sh,act=n.t<=now&&now<n.t+n.d,xx=x(n.t),w=Math.max(3,n.d*pps-2),hh=Math.max(4,rowH*.8);
    c.fillStyle=act?'#FFB020':(n.t+n.d<now?'rgba(255,176,32,.32)':'rgba(255,176,32,.72)');
    if(act){c.shadowColor='#FFB020';c.shadowBlur=14}c.beginPath();if(c.roundRect)c.roundRect(xx,y(m)-hh/2,w,hh,3);else c.rect(xx,y(m)-hh/2,w,hh);c.fill();c.shadowBlur=0;
    if(act){c.fillStyle='#1A1000';if(w>26)c.fillText(nn(m),xx+4,y(m)+4)}}
  c.fillStyle='rgba(255,255,255,.55)';c.fillRect(playX-1,0,2,H);
  c.lineWidth=3.5;c.lineCap='round';let prev=null;
  for(const p of KAR.trace){if(p.t<t0||p.t>now+.05){prev=null;continue}
    if(prev&&p.t-prev.t<.2){c.strokeStyle=p.hit===true?'#3DDC84':p.hit===false?'#FF5252':'rgba(255,255,255,.7)';c.beginPath();c.moveTo(x(prev.t),y(prev.m));c.lineTo(x(p.t),y(p.m));c.stroke()}prev=p}
  const lv=KAR.live;if(lv&&performance.now()-lv.at<300){const col=lv.hit===true?'#3DDC84':lv.hit===false?'#FF5252':'#FFFFFF';c.fillStyle=col;c.shadowColor=col;c.shadowBlur=12;c.beginPath();c.arc(playX,y(lv.m),7,0,Math.PI*2);c.fill();c.shadowBlur=0}
  // visor e letra
  const tg=melAt(song,now);const tm=tg?tg.m+sh:null;if(tm!==KAR.tgt){KAR.tgt=tm;const e=$('#ktg');if(e)e.textContent=tm==null?'—':nn(tm)}
  const kt=$('#kt');if(kt)kt.textContent=fmt(now);const sk=$('#kseek');if(sk&&document.activeElement!==sk)sk.value=Math.round(now/song.dur*1000);
  const ly=$('#karly');if(ly&&song.lines.length){let li=-1;for(let i=0;i<song.lines.length;i++){if(song.lines[i].t<=now+.6)li=i;else break}
    const line=song.lines[Math.max(0,li)],done=li<0?0:line.syl.filter(s=>s.t<=now).length,key=li+':'+done;
    if(key!==KAR.lyrKey){KAR.lyrKey=key;const nx=song.lines[li+1];
      ly.innerHTML=`<div class="l1">${li<0?'<span class="w">'+esc(song.lines[0].syl.map(s=>s.s).join(''))+'</span>':line.syl.map((s,i)=>`<span class="${i<done?'d':'w'}">${esc(s.s)}</span>`).join('')}</div><div class="l2">${li>=0&&nx?esc(nx.syl.map(s=>s.s).join('')):'&nbsp;'}</div>`}}
}
